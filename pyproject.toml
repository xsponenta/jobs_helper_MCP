[project]
name = "jobs-helper-mcp"
version = "0.1.0"
description = "Job search and application assistant built on MCP and two cooperating agents"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "claude-agent-sdk>=0.2.168",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "lxml>=6.1.3",
    "markdown>=3.11.1",
    "mcp>=2.3.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pandas>=3.0.6",
    "playwright>=1.64.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
