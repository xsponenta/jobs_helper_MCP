<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Frontend Engineer</title></head>
<body>
<h1>Frontend Engineer</h1><p>Great job description.</p>
<a href="#" id="go" onclick="document.getElementById('f').style.display='block';this.remove();return false;">Apply for this job</a>
<form id="f" style="display:none">
  <label for="n">Full name *</label><input id="n" name="name" required>
  <label for="e">Email *</label><input id="e" name="email" type="email" required>
  <label for="r">Resume *</label><input id="r" name="resume" type="file" required>
  <button type="submit">Send</button>
</form>
<script>document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); document.body.innerHTML = '<h2>Application received</h2>'; });</script>
</body></html>
